# TriviumCode 项目配置（进 Git，团队共享）
# 本机绝对路径与探针结论在 config.local.yaml（不进 Git）
# verify.build / verify.test 只执行此处显式声明的命令——编排器不猜测执行（§14.1）
# 本文件由 trivium init 从 trivium.config.v1 改写而来，原文见 config.yaml.trivium-backup（YAML 往返会丢失注释，原注释在备份里）

schema: trivium.config.v2
archive_root: .reviews
topic:
  max_len: 64
runtime:
  node: null
  run_root: ~/.trivium/runs
isolation:
  peer_artifact_globs:
    - "**/*-gemini.md"
    - "**/*-glm.md"
  context_max_docs: 12
review:
  # 本仓开发会话由 Codex 主攻；它不参与自己的审查。产品内置默认集合保持不变。
  default_critics: [claude, gemini, glm]
  failure_policy: strict
  timeout_s:
    # plan 2700：codex 侧曾三次撞满 plan 预算致整轮作废（台账第 4、9、18 行）。成因是核查面随稿子
    # 与 --context 线性增长，不是挂死（被掐断时仍在正常产出）；2700 对已观测的 30m 留约 3 成余量。
    # **再撞先收窄 --context 与焦点，别再往上加**——1500→1800 那次只调数字，一个主题后就被打穿。
    # code 3600（由 7200 砍半）是明知的取舍：qwen 侧曾有一轮代码双审跑到 118m53s。
    # 现役 qwen 家族撞满就调这里。
    plan: 2700
    code: 3600
    bug: 1800
  wait_timeout_s: 180
  heartbeat_stale_s: 120
  retry:
    transient_max: 1
  cache: false
  min_tool_calls:
    plan: 5
    code: 5
    bug: 5
  min_project_reads:
    plan: 3
    code: 3
    bug: 3
  on_drift: warn
  on_drift_related: fail
  sensitive_globs:
    - .env*
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
  skip_doc_only_review: false
  skip_globs:
    - "**/*.md"
    - docs/**
    - "**/*.txt"
  never_skip_globs:
    - "**/package.json"
    - "**/pubspec.yaml"
    - "**/Cargo.toml"
    - "**/requirements*.txt"
    - .github/**
    - .gitlab-ci.yml
    - Dockerfile
    - .claude/**
    - .trivium/**
  allow_partial_flag: true
  max_critics: 3
profiles:
  default:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    # Codex 默认走官方 native；模型与本机官方基底配置一致。
    codex:
      plan: gpt-6.1-sol
      code: gpt-6.1-sol
      bug: gpt-6.1-sol
    # Claude 默认档走官方 Opus，显式请求 medium；实际模型与 effort 以运行回读为准。
    claude:
      plan: { model: opus, effort: medium }
      code: { model: opus, effort: medium }
      bug: { model: opus, effort: medium }
  flash:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3-Flash
      code: GLM-5.3-Flash
      bug: GLM-5.3-Flash
    # Codex flash 按用户指定使用官方 gpt-6-luna，不新增 effort 默认值。
    codex:
      plan: gpt-6-luna
      code: gpt-6-luna
      bug: gpt-6-luna
    # Claude flash 档走官方 Sonnet，显式请求 medium。
    claude:
      plan: { model: sonnet, effort: medium }
      code: { model: sonnet, effort: medium }
      bug: { model: sonnet, effort: medium }
  # pro 档：按需 `--profile pro` 单次切档，按侧选择更高档模型或 effort。
  # gemini / glm 与 default 同值是结果不是漏改：gemini 目录里的 3.1-pro 比 3.8-flash 旧两代，
  # GLM-5.3 已是顶档；Codex pro 按用户指定使用官方 gpt-6-astra。
  # Claude high 使用官方 Opus，显式请求 high，与 default 的 medium 区分。
  pro:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    codex:
      plan: gpt-6-astra
      code: gpt-6-astra
      bug: gpt-6-astra
    claude:
      # high 显式绑定官方 native，与 Agent 默认接入保持一致。
      plan: { tier: high }
      code: { tier: high }
      bug: { tier: high }
active_profile: default
gate:
  allow_defer: true
  block_business_write_when_awaiting_approval: true
  approval_lock_scope: session
  approval_lock_ttl_h: 24
  block_commit: true
  stop_hook_max_blocks: 2
  reason_policy: warn
  joint_blocker_policy: warn
preflight:
  auth_cache_ttl_h: 1
verify:
  build:
    - npm run typecheck
    - npm run build
  test:
    - npm test
retention:
  run_dir_days: 30
probe_ttl_days: 7
agents:
  gemini:
    vendor: antigravity
    bin: null
    agent: trivium-critic
    effort:
      plan: high
      code: high
      bug: high
  glm:
    vendor: zcode
    entry: null
  # 显式钉住，不靠代码内置默认兜底——否则改一行代码默认就能悄悄换掉本仓的审查模型。
  codex:
    vendor: openai
    bin: null
    # 显式 null 选择官方 native，覆盖内置供应商默认；第三方须单次显式选择 profile 和匹配模型。
    profile: null
    # 不设置项目 effort 默认值；官方基底的声明与运行回读分别记录。
  # Claude 默认走官方 native；模型别名与实际模型、供应商回读分别记录。
  claude:
    vendor: anthropic
    profile: null
    tiers:
      high: { model: opus, effort: high, profile: null }
