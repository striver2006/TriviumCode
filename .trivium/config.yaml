# TriviumCode 项目配置（进 Git，团队共享）
# 本机绝对路径与探针结论在 config.local.yaml（不进 Git）
# verify.build / verify.test 只执行此处显式声明的命令——编排器不猜测执行（§14.1）
# 本文件由 trivium init 从 trivium.config.v1 改写而来，原文见 config.yaml.trivium-backup（YAML 往返会丢失注释，原注释在备份里）

schema: trivium.config.v2
archive_root: .reviews
topic:
  max_len: 64
  forbid_chars:
    - /
    - \
    - ..
    - " "
runtime:
  node: null
  run_root: ~/.trivium/runs
isolation:
  peer_artifact_globs:
    - "**/*-gemini.md"
    - "**/*-glm.md"
  deny_via_cli: auto
  context_max_docs: 12
review:
  parallel: true
  failure_policy: strict
  timeout_s:
    plan: 1500
    code: 7200
    bug: 1200
  wait_timeout_s: 180
  heartbeat_stale_s: 120
  retry:
    transient_max: 1
  cache: false
  min_tool_calls:
    plan: 5
    code: 5
    bug: 5
  min_project_reads:
    plan: 3
    code: 3
    bug: 3
  on_drift: warn
  on_drift_related: fail
  sensitive_globs:
    - .env*
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
  skip_doc_only_review: false
  skip_globs:
    - "**/*.md"
    - docs/**
    - "**/*.txt"
  never_skip_globs:
    - "**/package.json"
    - "**/pubspec.yaml"
    - "**/Cargo.toml"
    - "**/requirements*.txt"
    - .github/**
    - .gitlab-ci.yml
    - Dockerfile
    - .claude/**
    - .trivium/**
  allow_partial_flag: true
  max_critics: 3
profiles:
  default:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    # 2026-09-21 用户指定改回 qwen 家族（`agents.codex.profile` 同步改成 qwen），三阶段统一 flash 档。
    # **不是 max**：2026-09-16 实测 qwen3.8-max 在 effort=high 下撞满过 plan 阶段的 1500s 预算、
    # 零产出，而 qwen3.8-flash 同期 419s / 1038s 交卷——本轮先按 max 配过一版，随即按此实测改回 flash。
    # 仍未消除的风险：2026-09-18 换去 deepseek 的原因是 codex 侧（那时正是 qwen3.8-flash）在
    # M9 第 1～2 步的代码双审四轮里耗时 8m36s → 56m → 62m → 118m53s，最后一轮离 code 阶段
    # 7200s 预算只剩 66 秒。预算按用户裁定维持 7200s（2026-09-21），撞了再调 review.timeout_s.code，
    # 不要默默换家族——换家族要连 agents.codex.profile 一起改（模型槽与 `-p` 是两个维度，见 flash 档注释）。
    codex:
      plan: qwen3.8-flash
      code: qwen3.8-flash
      bug: qwen3.8-flash
    # claude 档（M9 第 4 步）。slug 由 system/init 回读挣来（第 1 步报告 §4），
    # 不是文档推断——probe.cli.claude.models 为 []，猜错 slug 预检拦不下来。
    # 真实审查尺度的耗时与成本未测，第 6 步验收才会有第一份数据。
    claude:
      plan: claude-sonnet-5
      code: claude-sonnet-5
      bug: claude-sonnet-5
  flash:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3-Flash
      code: GLM-5.3-Flash
      bug: GLM-5.3-Flash
    # 必须跟着 agents.codex.profile 一起换家族：模型槽与 `-p` 是两个维度，
    # 留成 deepseek-flash 就会组成 `-p qwen -m deepseek-flash`，实测被端点直接拒绝
    # （见 probes/codex.ts 的跨家族记录）。2026-09-21 随 default 档回到 qwen。
    # **本档与 default 同为 qwen3.8-flash 是结果，不是漏改**：用户已把 default 统一到 flash 档，
    # qwen 目录里更低的一档 qwen3.6-flash 在本仓从未实测过，不拿没数据的档位去填这一格。
    # 真要让 flash 档在本侧有区分度，先给 qwen3.6-flash 跑一轮取数，再改这里。
    codex:
      plan: qwen3.8-flash
      code: qwen3.8-flash
      bug: qwen3.8-flash
    # flash 档取 haiku，不跟 default 同值（计划双审 CODEX-05）：
    # haiku 是 probes/claude.ts 的 PROBE_MODEL、M6 起一直在用，回读记录早有。
    # 两档同值会让 flash 在 claude 侧形同虚设，而另两家的 flash 行都是真换了一档。
    claude:
      plan: claude-haiku-4-5-20251001
      code: claude-haiku-4-5-20251001
      bug: claude-haiku-4-5-20251001
active_profile: default
gate:
  require_adjudication: true
  allow_defer: true
  block_business_write_when_awaiting_approval: true
  approval_lock_scope: session
  approval_lock_ttl_h: 24
  block_commit: true
  stop_hook_max_blocks: 2
  max_check_retries: 3
  reason_policy: warn
  joint_blocker_policy: warn
preflight:
  auth_cache_ttl_h: 1
verify:
  build:
    - npm run typecheck
    - npm run build
  test:
    - npm test
retention:
  run_dir_days: 30
probe_ttl_days: 7
agents:
  gemini:
    vendor: antigravity
    bin: null
    agent: trivium-critic
    effort:
      plan: high
      code: high
      bug: high
    readonly_commands:
      - git log
      - git blame
      - git diff
      - git show
      - git status
      - ls
      - cat
      - head
      - tail
      - grep
      - rg
      - find
      - wc
  glm:
    vendor: zcode
    entry: null
    max_turns: 40
    unsupported_override: reject
  # 显式钉住，不靠代码内置默认兜底。gemini 与 glm 本来就是显式的，唯独 codex 此前
  # 靠默认值——改一行代码默认就能悄悄改掉本仓库的审查模型，而本文件看起来什么都没发生。
  # profile 决定 provider 家族，也决定模型目录（目录随 profile 分层，slug 猜不出家族）。
  codex:
    vendor: openai
    bin: null
    # 2026-09-21：deepseek → qwen（用户指定）。这一行决定 provider 家族与模型目录，
    # 必须与 profiles.*.codex 的 slug 同家族，否则端点直接拒绝。
    profile: qwen
    effort:
      plan: high
      code: high
      bug: high
  # claude 段（M9 第 4 步）。只有判别式，没有其它字段——这是刻意的不对称：
  # 另三家的入口覆盖都有真实消费方，而 claude 的入口由探针独占
  # （probe.cli.claude.entrypoint），加 bin 就是加一个死字段。
  claude:
    vendor: anthropic
