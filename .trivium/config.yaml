# TriviumCode 项目配置（进 Git，团队共享）
# 本机绝对路径与探针结论在 config.local.yaml（不进 Git）
# verify.build / verify.test 只执行此处显式声明的命令——编排器不猜测执行（§14.1）
# 本文件由 trivium init 从 trivium.config.v1 改写而来，原文见 config.yaml.trivium-backup（YAML 往返会丢失注释，原注释在备份里）

schema: trivium.config.v2
archive_root: .reviews
topic:
  max_len: 64
runtime:
  node: null
  run_root: ~/.trivium/runs
isolation:
  peer_artifact_globs:
    - "**/*-gemini.md"
    - "**/*-glm.md"
  context_max_docs: 12
review:
  # 本仓开发会话由 Codex 主攻；它不参与自己的审查。产品内置默认集合保持不变。
  default_critics: [glm, gemini, claude]
  failure_policy: strict
  timeout_s:
    # plan 2700：codex 侧曾三次撞满 plan 预算致整轮作废（台账第 4、9、18 行）。成因是核查面随稿子
    # 与 --context 线性增长，不是挂死（被掐断时仍在正常产出）；2700 对已观测的 30m 留约 3 成余量。
    # **再撞先收窄 --context 与焦点，别再往上加**——1500→1800 那次只调数字，一个主题后就被打穿。
    # code 3600（由 7200 砍半）是明知的取舍：qwen 侧曾有一轮代码双审跑到 118m53s。
    # 现役 qwen 家族撞满就调这里。
    plan: 3600
    code: 3600
    bug: 3600
  wait_timeout_s: 180
  heartbeat_stale_s: 120
  retry:
    transient_max: 1
  cache: false
  min_tool_calls:
    plan: 5
    code: 5
    bug: 5
  min_project_reads:
    plan: 3
    code: 3
    bug: 3
  on_drift: warn
  on_drift_related: fail
  sensitive_globs:
    - .env*
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
  skip_doc_only_review: false
  skip_globs:
    - "**/*.md"
    - docs/**
    - "**/*.txt"
  never_skip_globs:
    - "**/package.json"
    - "**/pubspec.yaml"
    - "**/Cargo.toml"
    - "**/requirements*.txt"
    - .github/**
    - .gitlab-ci.yml
    - Dockerfile
    - .claude/**
    - .trivium/**
  allow_partial_flag: true
  max_critics: 3
profiles:
  default:
    gemini:
      plan: { tier: medium }
      code: { tier: medium }
      bug: { tier: medium }
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    # Codex 默认走官方 Sol，显式请求 medium，避免继承本机基底的 high。
    codex:
      plan: { model: gpt-6.1-sol, effort: high }
      code: { model: gpt-6.1-sol, effort: high }
      bug: { model: gpt-6.1-sol, effort: high }
    # Claude 默认档经 Qwen 接入，使用 qwen4-max 并请求 high。
    claude:
      plan: { model: qwen4-max, effort: high }
      code: { model: qwen4-max, effort: high }
      bug: { model: qwen4-max, effort: high }
  flash:
    gemini:
      plan: { tier: low }
      code: { tier: low }
      bug: { tier: low }
    glm:
      plan: GLM-5.3-Flash
      code: GLM-5.3-Flash
      bug: GLM-5.3-Flash
    # Codex flash 使用官方 Terra，显式请求 medium。
    codex:
      plan: { model: gpt-6.1-terra, effort: high }
      code: { model: gpt-6.1-terra, effort: high }
      bug: { model: gpt-6.1-terra, effort: high }
    # Claude flash 档使用 qwen3.8-flash。
    claude:
      plan: qwen3.8-flash
      code: qwen3.8-flash
      bug: qwen3.8-flash
  # pro 档：按需 `--profile pro` 单次切档，按侧选择更高档模型或 effort。
  # Gemini pro 通过 high 档选择 Gemini 4 Carbon。
  # GLM pro 保持当前已配置的 GLM-5.3；Codex pro 使用官方 Astra high。
  # Claude pro 使用 qwen4-max 并请求 xhigh。
  pro:
    gemini:
      plan: { tier: high }
      code: { tier: high }
      bug: { tier: high }
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    codex:
      plan: { model: gpt-6-astra, effort: high }
      code: { model: gpt-6-astra, effort: high }
      bug: { model: gpt-6-astra, effort: high }
    claude:
      # high 显式绑定 qwen profile，与 Agent 默认接入保持一致。
      plan: { tier: high }
      code: { tier: high }
      bug: { tier: high }
active_profile: default
gate:
  allow_defer: true
  block_business_write_when_awaiting_approval: true
  approval_lock_scope: session
  approval_lock_ttl_h: 24
  block_commit: true
  stop_hook_max_blocks: 2
  reason_policy: warn
  joint_blocker_policy: warn
preflight:
  auth_cache_ttl_h: 1
verify:
  build:
    - npm run typecheck
    - npm run build
  test:
    - npm test
retention:
  run_dir_days: 30
probe_ttl_days: 7
agents:
  gemini:
    vendor: antigravity
    bin: null
    agent: trivium-critic
    # 快速核对、常规审查、复杂推理各用一档。Antigravity 通过模型名后缀指定推理强度。
    tiers:
      low: { model: gemini-4-hydrogen-high }
      medium: { model: gemini-4-neon-high }
      high: { model: gemini-4-carbon-high }
    effort:
      plan: high
      code: high
      bug: high
  glm:
    vendor: zcode
    entry: null
  # 显式钉住，不靠代码内置默认兜底——否则改一行代码默认就能悄悄换掉本仓的审查模型。
  codex:
    vendor: openai
    bin: null
    # 显式 null 选择官方 native，覆盖内置供应商默认；第三方须单次显式选择 profile 和匹配模型。
    profile: null
    # 各档 effort 在 profiles 中显式请求，生效值仍须独立回读。
  # Claude 经已有 cld qwen profile 接入；模型请求与实际供应商回读分别记录。
  claude:
    vendor: anthropic
    profile: qwen
    tiers:
      high: { model: qwen4-max, effort: xhigh, profile: qwen }
