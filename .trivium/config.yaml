# TriviumCode 项目配置（进 Git，团队共享）
# 本机绝对路径与探针结论在 config.local.yaml（不进 Git）
# verify.build / verify.test 只执行此处显式声明的命令——编排器不猜测执行（§14.1）
# 本文件由 trivium init 从 trivium.config.v1 改写而来，原文见 config.yaml.trivium-backup（YAML 往返会丢失注释，原注释在备份里）

schema: trivium.config.v2
archive_root: .reviews
topic:
  max_len: 64
runtime:
  node: null
  run_root: ~/.trivium/runs
isolation:
  peer_artifact_globs:
    - "**/*-gemini.md"
    - "**/*-glm.md"
  context_max_docs: 12
review:
  # 本仓开发会话由 Codex 主攻；它不参与自己的审查。产品内置默认集合保持不变。
  default_critics: [claude, gemini, glm]
  failure_policy: strict
  timeout_s:
    # plan 2700：codex 侧曾三次撞满 plan 预算致整轮作废（台账第 4、9、18 行）。成因是核查面随稿子
    # 与 --context 线性增长，不是挂死（被掐断时仍在正常产出）；2700 对已观测的 30m 留约 3 成余量。
    # **再撞先收窄 --context 与焦点，别再往上加**——1500→1800 那次只调数字，一个主题后就被打穿。
    # code 3600（由 7200 砍半）是明知的取舍：qwen 侧曾有一轮代码双审跑到 118m53s。
    # 现役 qwen 家族撞满就调这里。
    plan: 2700
    code: 3600
    bug: 1800
  wait_timeout_s: 180
  heartbeat_stale_s: 120
  retry:
    transient_max: 1
  cache: false
  min_tool_calls:
    plan: 5
    code: 5
    bug: 5
  min_project_reads:
    plan: 3
    code: 3
    bug: 3
  on_drift: warn
  on_drift_related: fail
  sensitive_globs:
    - .env*
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
  skip_doc_only_review: false
  skip_globs:
    - "**/*.md"
    - docs/**
    - "**/*.txt"
  never_skip_globs:
    - "**/package.json"
    - "**/pubspec.yaml"
    - "**/Cargo.toml"
    - "**/requirements*.txt"
    - .github/**
    - .gitlab-ci.yml
    - Dockerfile
    - .claude/**
    - .trivium/**
  allow_partial_flag: true
  max_critics: 3
profiles:
  default:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    # Windows 线（CC Switch 网关目录）：Sol 不在本机目录，default 档改用 qwen3.8-flash；
    # 目录以 `trivium doctor --only codex` 实测为准（显式钉住，不靠默认兜底）。
    codex:
      plan: { model: qwen3.8-flash, effort: medium }
      code: { model: qwen3.8-flash, effort: medium }
      bug: { model: qwen3.8-flash, effort: medium }
    # Claude 默认档走官方 Opus，显式请求 medium；实际模型与 effort 以运行回读为准。
    claude:
      plan: { model: opus, effort: medium }
      code: { model: opus, effort: medium }
      bug: { model: opus, effort: medium }
  flash:
    # medium 档以模型名后缀承载强度，不继承 Agent 的旧 high 补全值。
    gemini:
      plan: { tier: medium }
      code: { tier: medium }
      bug: { tier: medium }
    glm:
      plan: GLM-5.3-Flash
      code: GLM-5.3-Flash
      bug: GLM-5.3-Flash
    # Codex flash 走 CC Switch 目录的轻档 qwen3.6-flash，显式请求 medium。
    codex:
      plan: { model: qwen3.6-flash, effort: medium }
      code: { model: qwen3.6-flash, effort: medium }
      bug: { model: qwen3.6-flash, effort: medium }
    # Claude flash 档走官方 Sonnet，显式请求 medium。
    claude:
      plan: { model: sonnet, effort: medium }
      code: { model: sonnet, effort: medium }
      bug: { model: sonnet, effort: medium }
  # pro 档：按需 `--profile pro` 单次切档，按侧选择更高档模型或 effort。
  # Gemini pro 使用已核实目录和实际探活的 Argon high；完整审查验收另行记录。
  # GLM pro 保持当前已配置的 GLM-5.3；Codex pro 使用官方 Astra high。
  # Claude high 使用官方 Opus，显式请求 high，与 default 的 medium 区分。
  pro:
    gemini:
      plan: { tier: high }
      code: { tier: high }
      bug: { tier: high }
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    codex:
      plan: { model: qwen3.8-max, effort: high }
      code: { model: qwen3.8-max, effort: high }
      bug: { model: qwen3.8-max, effort: high }
    claude:
      # high 显式绑定官方 native，与 Agent 默认接入保持一致。
      plan: { tier: high }
      code: { tier: high }
      bug: { tier: high }
active_profile: default
gate:
  allow_defer: true
  block_business_write_when_awaiting_approval: true
  approval_lock_scope: session
  approval_lock_ttl_h: 24
  block_commit: true
  stop_hook_max_blocks: 2
  reason_policy: warn
  joint_blocker_policy: warn
preflight:
  auth_cache_ttl_h: 1
verify:
  build:
    - npm run typecheck
    - npm run build
  test:
    - npm test
retention:
  run_dir_days: 30
probe_ttl_days: 7
agents:
  gemini:
    vendor: antigravity
    bin: null
    agent: trivium-critic
    tiers:
      medium: { model: gemini-3.8-flash-medium }
      high: { model: gemini-4-argon-high }
    effort:
      plan: high
      code: high
      bug: high
  glm:
    vendor: zcode
    entry: null
  # 显式钉住，不靠代码内置默认兜底——否则改一行代码默认就能悄悄换掉本仓的审查模型。
  codex:
    vendor: openai
    bin: null
    # CC Switch（Windows 线）：基底 config.toml 由 CC Switch 管理（qwen 家族），原生路线判据
    # 拒绝静默第三方——经 ~/.codex/ccswitch.config.toml（仅一行家族声明、无凭据）显式选择。
    profile: ccswitch
    # 各档 effort 在 profiles 中显式请求，生效值仍须独立回读。
    # 只读降级（Windows 线）：上游 -s read-only 不拦截写（Bug 清单 §3.1-8），按提示语约束 +
    # 事后轨迹/漂移核验放行；预检带降级注记，写入一旦检出该侧作废。macOS 线不要开这个。
    readonly_enforcement: prompt-only
  # Claude 默认走官方 native；模型别名与实际模型、供应商回读分别记录。
  # Windows 线（CC Switch 支撑，无官方账号）：网关 env 经 --settings 内联注入——受限模式
  # 忽略 settings 文件但仍认内联，这是第三方网关下保住 --restricted 只读不变量的通道；
  # 官方登录机器上 env 段为空即自动无操作（键值不落留痕，指纹仅 sha256）。
  claude:
    vendor: anthropic
    profile: null
    settings_env_source: user_settings
    tiers:
      high: { model: opus, effort: high, profile: null }
