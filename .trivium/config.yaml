# TriviumCode 项目配置（进 Git，团队共享）
# 本机绝对路径与探针结论在 config.local.yaml（不进 Git）
# verify.build / verify.test 只执行此处显式声明的命令——编排器不猜测执行（§14.1）
# 本文件由 trivium init 从 trivium.config.v1 改写而来，原文见 config.yaml.trivium-backup（YAML 往返会丢失注释，原注释在备份里）

schema: trivium.config.v2
archive_root: .reviews
topic:
  max_len: 64
runtime:
  node: null
  run_root: ~/.trivium/runs
isolation:
  peer_artifact_globs:
    - "**/*-gemini.md"
    - "**/*-glm.md"
  context_max_docs: 12
review:
  # 本仓开发会话由 Codex 主攻；它不参与自己的审查。产品内置默认集合保持不变。
  default_critics: [claude, gemini, glm]
  failure_policy: strict
  timeout_s:
    # plan 2700：codex 侧曾三次撞满 plan 预算致整轮作废（台账第 4、9、18 行）。成因是核查面随稿子
    # 与 --context 线性增长，不是挂死（被掐断时仍在正常产出）；2700 对已观测的 30m 留约 3 成余量。
    # **再撞先收窄 --context 与焦点，别再往上加**——1500→1800 那次只调数字，一个主题后就被打穿。
    # code 3600（由 7200 砍半）是明知的取舍：qwen 侧曾有一轮代码双审跑到 118m53s。
    # 现役 qwen 家族撞满就调这里。
    plan: 2700
    code: 3600
    bug: 1800
  wait_timeout_s: 180
  heartbeat_stale_s: 120
  retry:
    transient_max: 1
  cache: false
  min_tool_calls:
    plan: 5
    code: 5
    bug: 5
  min_project_reads:
    plan: 3
    code: 3
    bug: 3
  on_drift: warn
  on_drift_related: fail
  sensitive_globs:
    - .env*
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
  skip_doc_only_review: false
  skip_globs:
    - "**/*.md"
    - docs/**
    - "**/*.txt"
  never_skip_globs:
    - "**/package.json"
    - "**/pubspec.yaml"
    - "**/Cargo.toml"
    - "**/requirements*.txt"
    - .github/**
    - .gitlab-ci.yml
    - Dockerfile
    - .claude/**
    - .trivium/**
  allow_partial_flag: true
  max_critics: 3
profiles:
  default:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    # 须与 agents.codex.profile 同家族，见该处注释。kimi profile 的缺省模型是 kimi-for-coding，
    # 这里显式钉 k3，不靠 profile 缺省兜底。
    codex:
      plan: kimi-for-coding
      code: kimi-for-coding
      bug: kimi-for-coding
    # claude 三档 slug 都须回读核实：probe.cli.claude.models 为 []，预检校验不了，猜错也拦不下。
    # 核法：`claude -p --output-format stream-json --model <slug>`，看 system/init.model 与 result。
    # 2026-09-27 已核：opus-5-5（约 $0.13）、sonnet-5（约 $0.20）、fable-5-1（约 $0.83）。
    claude:
      plan: claude-opus-5-5
      code: claude-opus-5-5
      bug: claude-opus-5-5
  flash:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3-Flash
      code: GLM-5.3-Flash
      bug: GLM-5.3-Flash
    # 取 kimi 目录里比 default（k3）低一档的 kimi-for-coding。
    codex:
      plan: kimi-for-coding
      code: kimi-for-coding
      bug: kimi-for-coding
    # 不与 default 同值（计划双审 CODEX-05）：同值会让 flash 在 claude 侧形同虚设。
    claude:
      plan: claude-sonnet-5
      code: claude-sonnet-5
      bug: claude-sonnet-5
  # pro 档：按需 `--profile pro` 单次切档。取值原则：只换模型目录里确有比 default 更高档的格。
  # gemini / glm 与 default 同值是结果不是漏改：gemini 目录里的 3.1-pro 比 3.8-flash 旧两代，
  # GLM-5.3 已是顶档；codex 同理，k3 已是 kimi 目录顶档。
  # claude-fable-5-1 单价明显高于 opus-5-5，真审成本相应放大。
  pro:
    gemini:
      plan: gemini-3.8-flash-high
      code: gemini-3.8-flash-high
      bug: gemini-3.8-flash-high
    glm:
      plan: GLM-5.3
      code: GLM-5.3
      bug: GLM-5.3
    codex:
      plan: k3
      code: k3
      bug: k3
    claude:
      plan: claude-fable-5-1
      code: claude-fable-5-1
      bug: claude-fable-5-1
active_profile: default
gate:
  allow_defer: true
  block_business_write_when_awaiting_approval: true
  approval_lock_scope: session
  approval_lock_ttl_h: 24
  block_commit: true
  stop_hook_max_blocks: 2
  reason_policy: warn
  joint_blocker_policy: warn
preflight:
  auth_cache_ttl_h: 1
verify:
  build:
    - npm run typecheck
    - npm run build
  test:
    - npm test
retention:
  run_dir_days: 30
probe_ttl_days: 7
agents:
  gemini:
    vendor: antigravity
    bin: null
    agent: trivium-critic
    effort:
      plan: high
      code: high
      bug: high
  glm:
    vendor: zcode
    entry: null
  # 显式钉住，不靠代码内置默认兜底——否则改一行代码默认就能悄悄换掉本仓的审查模型。
  codex:
    vendor: openai
    bin: null
    # profile 决定 provider 家族与模型目录（目录随 profile 分层）。**换家族必须与 profiles.*.codex
    # 同批改**：只改一处，要么被端点拒绝，要么预检以「不在该 profile 的模型目录中」退 64（均实测）。
    profile: kimi
    # effort 已删（M11 第 4 步）：它从未下传，实际请求的思考等级是 kimi profile 基底的值；档位落地后由 tiers 表达
  # claude 段（M9 第 4 步）。只有判别式，没有其它字段——这是刻意的不对称：
  # 另三家的入口覆盖都有真实消费方，而 claude 的入口由探针独占
  # （probe.cli.claude.entrypoint），加 bin 就是加一个死字段。
  claude:
    vendor: anthropic
