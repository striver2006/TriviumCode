# Antigravity（agy）载体适配层（M10b 第 2 步）
#
# 安装时拍平到全局根 ~/.gemini/config/skills/<命令名>/（r10 §2.2：工作区根在 print 模式下不读，
# 不作目标也不作备选；用户级 ~/.agents/skills 也不读，报告 §1.3.1）。
# 报告 §1.4：斜杠展开，**$ARGUMENTS 不替换**，参数原文随展开到达模型。
agent: gemini
layout: entry
frontmatter: [name, description]
arguments: transcribe
# 报告 §1.3：print 模式斜杠展开；交互模式未测
invocation: /{name}
