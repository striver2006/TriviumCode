# Claude Code 载体适配层（M10b 第 2 步；演进设计 §10.2）
#
# 产物落 skills/<命令名>/SKILL.md，由安装器同步到 ~/.claude/skills/。
# 这一家的产物是**兼容基线**：从现有 7 份 SKILL.md 抽出单源时，渲染回本载体须与原文件逐字节一致。
agent: claude
# top：产物落 skills/<命令名>/；entry：落 skills/dual-critic/entry/<agent>/<命令名>/（安装时拍平）
layout: top
# 产物 front-matter 输出哪些键（按契约里的书写顺序输出，不在此列的键丢弃）
frontmatter: [name, description, argument-hint, disable-model-invocation, allowed-tools]
# substitute：载体会把 $ARGUMENTS 替换成参数原文；transcribe：载体不替换，由模型按转抄规约拼参数
arguments: substitute
# 本载体调用入口 skill 的写法，{name} 换成命令名（第 1 步报告 §1.3 / §2.2 / §3.6；r9 §2.5 表）
invocation: /{name}
