# 差异化审查镜头（设计 §9.3）
#
# 两侧不问同一道题，避免「双审退化成同审」。镜头写入各自 BRIEF，
# 是分工而非主次——两侧仍独立看全被审对象。
#
# 可观测指标：若两侧 findings 的位置集合 Jaccard 相似度长期 > 0.8，
# `trivium report` 会输出「双审退化」提示，建议调整镜头或模型（不是报错）。

gemini:
  plan: |
    - 需求覆盖是否有遗漏：对照需求与验收标准，逐条找没被计划覆盖的点
    - 架构与**不可逆决策**是否写明：数据模型、对外契约、迁移方案、回滚路径
    - 被放弃的方案，其放弃理由是否成立
    - 跨模块依赖与破坏性变更：谁会被这次改动打断
  code: |
    - 实现是否偏离已批准的计划：偏离本身不一定错，但必须是显式的
    - 对外契约漂移：签名、返回形状、错误码、事件格式
    - 无必要的复杂度：能用更少的抽象达成同样效果吗
    - 跨文件调用链断裂：改了这里，链路上游/下游还成立吗
  bug: |
    - 证据链是否闭合：从现象到根因，每一步都有可核对的依据吗
    - 是否存在**第二根因**：修掉这个就真的不复现了吗
    - 结论与现象是否真正因果，而非相关

glm:
  plan: |
    - 边界与失败路径：空、超限、超时、部分成功、重复提交
    - 并发、幂等与数据一致性：并行执行会怎样，重试会怎样
    - 验收标准是否**真能测**：怎样才算通过，怎样才算失败
    - 本土技术栈与运维约束：依赖可得性、合规、部署环境
  code: |
    - 安全：注入、鉴权与授权、密钥处理、路径穿越、反序列化
    - 并发与错误处理：竞态、锁、未捕获异常、错误被吞掉
    - 空值与越界：解引用、下标、类型断言
    - 测试缺口：**这条测试要怎样才会失败**——如果它永远通过，它没有价值
  bug: |
    - 复现是否充分：步骤、环境、数据、频率
    - 修复面是否过大或治标：会不会顺手改了不相干的东西
    - 同一模式在别处是否还存在
    - 回归用例是否会漏：它能捕获这次的 bug 吗

# codex（Critic-C）取第三视角。三条轴刻意与 A/B 两侧**零字面交叠**：
# 计划双审 GLM-10 指出初版有三条与既有镜头字面重合（「回滚路径」「谁会被打断」「环境」），
# 而 report 的 Jaccard 退化提示按 lenses.yaml 自己的口径要「长期 > 0.8」才触发，
# 一两轮看不出来——字面重合现在就能收窄，比事后告警便宜。
codex:
  plan: |
    - 外部依赖与环境假设：版本、平台、可得性，哪些前提在别人机器上不成立
    - 成本与配额：这次要烧多少、失败时烧多少、有没有更便宜的等价路径
    - 回滚与迁移的**成本核算**：真要退回去，要几步、丢什么、谁来做
  code: |
    - 跨平台与环境耦合：路径分隔、shell 差异、编码、locale、临时目录
    - 资源与生命周期：文件句柄、子进程、临时文件、超时后谁来收尾
    - 运行环境与依赖版本兼容：Node 版本、CLI 版本漂移、打包产物的约束
  bug: |
    - 时序与环境变量态：并发、时钟、locale、继承来的 env 是否参与了故障
    - 证据能不能在**别的机器**上重放：依赖本机状态的结论算不算数
    - 修复的可观测性：下次再发生，从哪条留痕能立刻看出来

# claude（Critic-D）取第四视角：**规范链与断言的自洽**。
# 三条轴同样与另三家零关键短语交叠（口径见上方 codex 注释）。
# 选这个视角的依据是 M6～M8 的实际失误分布：同一份事实散落在设计正文、台账、
# 报告、BACKLOG 四处而彼此漂移（§24.1 与 §9.3 的镜头键数、EV-12 对 P7 的加强转述），
# 这类缺陷另三家的镜头都不朝它看，而它恰好是本项目「文档即验收口径」的要害。
claude:
  plan: |
    - 条款的副本面：这次要改的说法在仓库里有几份表述，只改一处会让哪一份变成失实
    - 断言的适用范围：写了「一律」「绝不」的地方真的没有例外吗，有例外就要就地写明
    - 新增概念的层次归属：它该由谁持有、谁来消费，有没有更该放的位置
  code: |
    - 实现与它自己的说明书是否同口径：注释、类型说明、用户文档里的承诺，代码兑现了吗
    - 新代码与周围惯例的贴合：命名、错误处理形态、目录分层，是否自成一套
    - 未接线的产出：新加的字段与分支有没有真正的消费方，还是只有定义处
  bug: |
    - 问题陈述自身是否成立：报告里引的前提，有没有对着原文逐句验过
    - 同一份事实在几处被写下，它们现在还同口径吗
    - 结论的措辞强度是否超出证据：从「某次实测」推到「一律」的那一步站得住吗
